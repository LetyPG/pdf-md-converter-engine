name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    # Improvement 4: Added a job timeout to prevent hanging executions and save CI minutes
    timeout-minutes: 10

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
        # Improvement 6: Explicit installation of Playwright binaries and OS dependencies
        # This is strictly required because `pip install` only fetches the Python bindings,
        # not the underlying browser engine or Linux libraries needed for headless CI execution.
        python -m playwright install --with-deps chromium

    - name: Code Validation (Syntax Integrity)
      run: |
        echo "Performing project-wide syntax validation..."
        # Improvement 5: Replaced hardcoded imports with a maintainable project-wide compile check
        # This catches syntax errors across all modules immediately without executing them.
        python -m compileall src/ scripts/ ui/ tests/ -q
        echo "Syntax integrity check passed."

    - name: Start Background UI Server
      run: |
        echo "Starting Streamlit server for E2E testing..."
        # Improvement 2: Capture Streamlit logs to a file for artifact uploading
        python -m streamlit run ui/app.py --server.headless true > streamlit.log 2>&1 &
        
        # Improvement 1: Active health-check loop replacing the fixed `sleep 10`
        # This reduces pipeline time if the server starts fast, and fails cleanly if it doesn't.
        timeout 30 bash -c 'until curl -sSf http://localhost:8501 > /dev/null; do echo "Waiting for Streamlit..."; sleep 2; done'
        echo "Streamlit server is ready."

    # Improvement 3: Split tests into stages for immediate diagnostic feedback
    - name: Execute Unit Tests
      run: |
        echo "Running Unit tests..."
        pytest tests/unit -v

    - name: Execute Integration Tests
      run: |
        echo "Running Integration tests..."
        pytest tests/integration -v

    - name: Execute UI / E2E Tests
      run: |
        echo "Running UI E2E tests..."
        pytest tests/ui -v

    - name: Upload Streamlit Logs on Failure
      # Improvement 2: Provide clear contributor-friendly diagnostics on UI test failures
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: streamlit-server-logs
        path: streamlit.log
        retention-days: 7
